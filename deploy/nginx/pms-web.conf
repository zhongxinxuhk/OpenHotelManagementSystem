# PMS 管理端静态托管配置（裸机 nginx 用，不依赖容器）
#
# 用法：
#   cp deploy/nginx/pms-web.conf /etc/nginx/conf.d/pms-web.conf
#   # 把前端发行包里的 dist/ 内容放到 /usr/share/nginx/pms-web
#   nginx -t && nginx -s reload
#
# 两条必须成立的规则：
#   1. SPA 路由回退：/user/list 这类前端路由在服务端没有对应文件，
#      不回退到 index.html 就是刷新 404 —— 这是最常见的部署事故。
#   2. 带 hash 的构建产物可以长期缓存，index.html 绝不能缓存：
#      缓存了 index.html 的用户会拿到旧版本号，指向已被清理的旧产物。

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/pms-web;
    index  index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # index.html 不缓存：它是"当前版本"的唯一入口
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Umi 产物文件名带 hash（例如 umi.1a2b3c.js），可以放心长缓存
    location ^~ /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # 其余路径全部交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
