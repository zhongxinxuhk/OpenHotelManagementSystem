# =====================================================================
# test 档案：上下文冒烟测试用（ApplicationContextTests / OpenApiContractTest）。
#
# 【必须排除 MyBatis 自动配置】—— 注释声称的"排除 DataSource/Flyway/MyBatis"
# 一直只写在文档里，配置层面从未落实。后果在 R-20261101-33 暴露：
# mybatis-spring-boot 4.x 的自动扫描器（MapperScannerConfigurer）在没有
# DataSource 的 test 上下文里也会注册，与 NoDatabaseStubConfig 的手工
# @Bean 桩同名冲突（ConflictingBeanDefinitionException: idempotencyMapper），
# 全部上下文冒烟测试一片红。
# =====================================================================
# 三件套一起排：只排 MyBatis 不够——DataSource 自动配置仍会尝试创建 Hikari
# （无 url → "Failed to determine a suitable driver class"），health 端点的
# dbHealthContributor 会把它拉起来。与 NoDatabaseStubConfig 的桩配套，
# test 档案不连任何库。
spring.autoconfigure.exclude=\
  org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.health.DataSourceHealthContributorAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

# 住客归属验证：集成/测试环境启用开发信箱（生产必须 false，见 application.properties 注释）
pms.guest.ownership.dev-mailbox=true

# 上下文冒烟测试用的**测试专用假密钥**（32 字节 Base64）。
# 这里曾经是隐性依赖：测试进程要靠外部 env 注入密钥，上下文才起得来——
# CI 有（backend.yml 每次生成），本地单跑一个测试类就崩，且报错是
# "GuestPiiCipher 构造失败"，完全看不出该 export。真实数据的密钥
# 只在 integration 档案由 PMS_GUEST_PII_KEY 提供，两者互不影响。
pms.guest.pii-key=${PMS_GUEST_PII_KEY:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}
pms.guest.pii-hmac-key=${PMS_GUEST_PII_HMAC_KEY:ICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj8=}

# RabbitMQ 监听器不随上下文启动：test 档案没有任何中间件。
# 不关的话监听容器会连 localhost:5672（认证失败 → 上下文起不来）。
# 消息行为在 integration 档案（真实 RabbitMQ）验证。
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

# 公开面控制器在 test 档案注册（R-20261103-02）：契约基线包含 /api/v1/public/**，
# OpenApiContractTest 的实时文档必须与基线同形——开关必须与导出基线时的口径一致。
# 控制器只做文档生成不会被打（方法一律抛 stub），不影响其它上下文测试。
pms.public-api.enabled=true
