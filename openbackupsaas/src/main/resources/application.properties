# 公共配置：只放与运行环境无关的稳定项。
# 环境相关配置（数据源、文档开关、日志级别）放在 application-<profile>.properties。
# 不允许把密码、令牌、连接串明文写进版本库（见 docs/adr/ADR-011 §3、S6-05）。
spring.application.name=pms
spring.profiles.default=local

# ---------- Web ----------
server.port=${PMS_SERVER_PORT:8080}
server.shutdown=graceful
spring.mvc.problemdetails.enabled=true

# ---------- 序列化 ----------
# Boot 4 使用 Jackson 3：时间默认输出 ISO-8601 字符串（不再有 WRITE_DATES_AS_TIMESTAMPS 开关），
# 因此不配置 write-dates-as-timestamps，避免绑定到已移除的属性导致启动失败。
spring.jackson.default-property-inclusion=non_null

# ---------- 错误响应：不向客户端暴露堆栈与内部类名 ----------
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---------- 认证与会话（S1-03） ----------
# 会话有效期：ISO-8601 时长。过期即失效，不做滑动续期（续期语义待 S3-01 前端接入时定）。
pms.security.session-ttl=${PMS_SESSION_TTL:PT8H}

# ---------- 锁房超时承接（S1-10） ----------
# enabled 默认 true：忘记配开关的代价是"锁房永不释放"，比多跑一个扫描线程严重。
# 无库的 test 档案与 integration 档案显式关闭，测试自己调用服务方法。
# scan-interval 为 fixedDelay（上一轮结束到下一轮开始），ISO-8601 时长。
pms.reservation.expiry.enabled=${PMS_HOLD_EXPIRY_ENABLED:true}
pms.reservation.expiry.scan-interval=${PMS_HOLD_EXPIRY_SCAN_INTERVAL:PT30S}
pms.reservation.expiry.initial-delay=${PMS_HOLD_EXPIRY_INITIAL_DELAY:PT10S}
pms.reservation.expiry.batch-size=${PMS_HOLD_EXPIRY_BATCH_SIZE:50}

# ---------- 运行角色（S2-01） ----------
# api：只跑 HTTP，不跑后台投递；worker：只跑后台，配合 --spring.main.web-application-type=none；
# all（默认）：单进程开发/演示。取值非法会直接启动失败，不会静默退化成"不跑 Worker"。
pms.runtime.role=${PMS_RUNTIME_ROLE:all}

# ---------- Outbox 投递（S2-01） ----------
# poller 关闭时事件只会在库里堆积，因此生产默认开启；测试档案必须显式关闭
# （无库环境跑不动，且有库时后台线程会与断言抢时序）。
pms.outbox.publisher=${PMS_OUTBOX_PUBLISHER:rabbit}
pms.outbox.exchange=${PMS_OUTBOX_EXCHANGE:pms.events}
# 等待 Broker 确认的上限：必须小于 lease-duration，否则租约到期时确认还没回来，
# 会出现"同一条事件被两个 Worker 同时发布"，白白制造重复。
pms.outbox.confirm-timeout=${PMS_OUTBOX_CONFIRM_TIMEOUT:PT5S}
pms.outbox.poller.enabled=${PMS_OUTBOX_POLLER_ENABLED:true}
pms.outbox.poll-interval=${PMS_OUTBOX_POLL_INTERVAL:PT5S}
pms.outbox.initial-delay=${PMS_OUTBOX_INITIAL_DELAY:PT5S}
pms.outbox.batch-size=${PMS_OUTBOX_BATCH_SIZE:50}
pms.outbox.lease-duration=${PMS_OUTBOX_LEASE_DURATION:PT30S}
pms.outbox.base-backoff=${PMS_OUTBOX_BASE_BACKOFF:PT2S}
pms.outbox.max-backoff=${PMS_OUTBOX_MAX_BACKOFF:PT5M}
# 连续失败到这个数就中止本轮：Broker 整体不可用时，逐条硬试等于 批大小 × 确认超时
pms.outbox.max-consecutive-failures=${PMS_OUTBOX_MAX_CONSECUTIVE_FAILURES:3}
pms.outbox.monitor.enabled=${PMS_OUTBOX_MONITOR_ENABLED:true}
pms.outbox.monitor-interval=${PMS_OUTBOX_MONITOR_INTERVAL:PT30S}
pms.outbox.alert-age=${PMS_OUTBOX_ALERT_AGE:PT10M}

# ---------- Inbox 消费（S2-02） ----------
# 默认开启：忘记开开关的代价是"事件永不消费"，比多一个消费线程严重。
# 无 Broker 的本地开发请用 pms.runtime.role=api（不起 Worker 侧组件）或显式置 false。
# test / integration 档案显式关闭：用例自己驱动消费者，才能断言"这条到底应用了几次"。
pms.inbox.enabled=${PMS_INBOX_ENABLED:true}
pms.inbox.queue=${PMS_INBOX_QUEUE:pms.inbox}
# 逗号分隔的路由键。默认订阅**当前代码真正会发出的全部事件类型**（7 个），一个不多一个不少。
#
# 为什么必须列全：发布器开了 mandatory，事件不可路由即视为发布失败
# （见 RabbitEventPublisher 的"不可路由也算失败"）。没有队列绑定的事件类型不会被悄悄丢弃，
# 而是让这条 outbox 记录留在库里一轮轮重试，直到 OutboxBacklogMonitor 一直告警——
# 本轮实测：RoomOccupancyHeld / RoomOccupancyReleased 因未绑定而各重试 10 次全部失败。
# 有事件要知道它去哪；没有就别发出去，而不是发出去让它漂着。
#
# 注意：topic 交换机的 * 必须独占一个词（`Reservation.*`），写成 `Reservation*` 会被当成
# 字面词一个都不匹配——绑定看起来成功、消息却全部不可路由。事件类型是单单词，故用显式列表。
pms.inbox.routing-keys=${PMS_INBOX_ROUTING_KEYS:ReservationCreated,ReservationConfirmed,ReservationCancelled,ReservationNoShow,ReservationExpired,RoomOccupancyHeld,RoomOccupancyReleased}

# ---------- 外部任务与渠道策略（S2-03） ----------
# worker 只在 Worker 角色下装配；测试档案显式关闭，用例自己驱动执行器。
pms.integration.task.worker-enabled=${PMS_TASK_WORKER_ENABLED:true}
pms.integration.task.poll-interval=${PMS_TASK_POLL_INTERVAL:PT10S}
pms.integration.task.initial-delay=${PMS_TASK_INITIAL_DELAY:PT10S}
pms.integration.task.batch-size=${PMS_TASK_BATCH_SIZE:20}
# 租约要大于单次调用超时，否则调用还没回来租约就过期，同一条任务会被两个实例同时执行
pms.integration.task.lease-duration=${PMS_TASK_LEASE_DURATION:PT2M}
pms.integration.task.base-backoff=${PMS_TASK_BASE_BACKOFF:PT5S}
pms.integration.task.max-backoff=${PMS_TASK_MAX_BACKOFF:PT1H}
#
# 渠道策略按需覆盖（未配置的渠道走代码里的默认值：5 次、超时 10 秒、熔断阈值 5、冷却 60 秒）：
#   pms.integration.channel.<渠道名>.max-attempts=5
#   pms.integration.channel.<渠道名>.min-interval=PT1S
#   pms.integration.channel.<渠道名>.timeout=PT10S
#   pms.integration.channel.<渠道名>.circuit-threshold=5
#   pms.integration.channel.<渠道名>.circuit-cooldown=PT60S

# ---------- 内部对账与派生修复（S2-05） ----------
# 定时对账只在 Worker 角色下装配；测试档案显式关闭，用例自己驱动服务。
pms.reconcile.enabled=${PMS_RECONCILE_ENABLED:true}
pms.reconcile.poll-interval=${PMS_RECONCILE_INTERVAL:PT1H}
pms.reconcile.initial-delay=${PMS_RECONCILE_INITIAL_DELAY:PT5M}
# 每轮往后扫的天数。窗口越小越省资源，但问题暴露也越晚；14 天与渠道推送窗口对齐。
pms.reconcile.window-days=${PMS_RECONCILE_WINDOW_DAYS:14}
# 自动修复只作用于派生类（房态投影）。置 false 时全部差异都留给人判断。
pms.reconcile.auto-repair=${PMS_RECONCILE_AUTO_REPAIR:true}
pms.reconcile.hotel-batch-size=${PMS_RECONCILE_HOTEL_BATCH:50}
# 积压多久算异常。太短会把正常抖动报成故障，太长等于没有告警。
pms.reconcile.backlog.outbox-age=${PMS_RECONCILE_OUTBOX_AGE:PT15M}
pms.reconcile.backlog.inbox-age=${PMS_RECONCILE_INBOX_AGE:PT15M}

# ---------- 消息系统连接（ADR-011：只选 RabbitMQ） ----------
# 凭据必须来自环境变量，不允许写进版本库（S6-05）。
#
# 端口/用户名默认值必须与 deploy/compose/docker-compose.yml 的**宿主侧**一致，否则
# "按文档起了 compose、按默认值起了后端，却连不上"——这是本轮实测的故障：
#   · compose 把容器 5672 映射成宿主 55672（避开本机可能存在的 RabbitMQ），
#     而这里曾默认 5672 → 表现为 Connection refused 反复重试；
#   · compose 的默认用户是按 RABBITMQ_DEFAULT_USER 建的 pms_mq（guest 只允许容器内回环），
#     而这里曾默认 guest → 连得上端口却被 ACCESS_REFUSED。
# 结论：三个默认值（宿主端口、用户名）跟编排走；只有口令必须外部注入，不在此写默认值之外的事。
spring.rabbitmq.host=${PMS_RABBIT_HOST:localhost}
spring.rabbitmq.port=${PMS_RABBIT_PORT:55672}
spring.rabbitmq.username=${PMS_RABBIT_USER:pms_mq}
spring.rabbitmq.password=${PMS_RABBIT_PASSWORD:guest}
# 连接超时调短：Broker 不可达时，长时间挂起会让一轮投递卡死，事件迟迟得不到退避记录
spring.rabbitmq.connection-timeout=${PMS_RABBIT_CONNECT_TIMEOUT:PT3S}
# 单次预取条数：太大意味着一次抓一堆消息在本地排队，出错时重投的爆炸半径也大
spring.rabbitmq.listener.simple.prefetch=${PMS_RABBIT_PREFETCH:10}

# ---------- 迁移：唯一迁移源与命名规则（ADR-009） ----------
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true

# ---------- MyBatis：SQL 显式可审查，不启用二级缓存 ----------
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-statement-timeout=5
mybatis.configuration.cache-enabled=false
mybatis.mapper-locations=classpath*:mapper/**/*.xml

# ---------- 应用信息（/actuator/info） ----------
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@

# ---------- 健康与端点 ----------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# ---------- 监控 / 链路（S2-06） ----------
# Prometheus 抓取端点 /actuator/prometheus 已暴露（见上）。业务指标统一走 PmsMetrics，
# 前缀 pms.，抓取端按前缀过滤即可。
#
# 链路默认关闭：采样率 0 表示不向外发任何 span。原则同 Outbox——不能让"默认配置"
# 就把内部调用细节发到一个没被批准的外部端点。需要观察时再把概率调上去，并配置
# management.otlp.tracing.endpoint 指向已批准的采集器，二者缺一不可。
management.tracing.sampling.probability=${PMS_TRACING_SAMPLING:0}

# ---------- 限流与防刷（J-05，ADR-020） ----------
# 匿名入口的统一闸门：住客注册/登录/发码/确认码、员工登录、平台登录、公开面查询。
# 档位表在 RateLimitRules 里（越贵的动作越严），启动日志会打印最终生效的档位。
#
# 默认开启：忘记配的代价是"匿名入口毫无防护"，被刷时付出的是短信费与数据库写入。
# 本地联调若被挡住，显式 PMS_RATE_LIMIT_ENABLED=false —— 不要为了让测试过而改大限额。
pms.rate-limit.enabled=${PMS_RATE_LIMIT_ENABLED:true}
#
# **安全参数**：只有 TCP 对端命中这里，才会采信 X-Forwarded-For。
# 部署在本机反代（nginx / Caddy）后面时填 127.0.0.1,::1；
# 填错（把不可信来源网段当代理）等于让攻击者自带无限额度：
# 每个伪造的转发地址都会得到一个全新的令牌桶。
# 空值 = 谁都不信，只用对端地址（最安全，落后端直连时正确）。
pms.rate-limit.trusted-proxies=${PMS_RATE_LIMIT_TRUSTED_PROXIES:}
#
# 令牌桶数量上限（内存护栏）。键含客户端地址，无界 Map 会被随机源地址撑爆。
pms.rate-limit.max-keys=${PMS_RATE_LIMIT_MAX_KEYS:50000}
#
# 单条档位覆盖（改完需重启）：
#   pms.rate-limit.rules.guest.login.permits=10
#   pms.rate-limit.rules.guest.login.window=PT5M

# ---------- 匿名公开面（J-02，ADR-017 §2.6） ----------
# 住客端的房型目录查询。**默认关闭**，理由不是"还没做完"，而是：
# 在限流与防刷（J-05）落地之前，一个可被无限刷的匿名查询接口
# 就是一台免费的库存探测机——别人可以用它把每家门店的房态爬成一张表。
#
# 关闭时控制器不注册，路径在安全链里虽是公开的但没有映射 → 404，
# 与"这个接口不存在"对外一致，不给出"以后会开"的线索。
#
# 开启前必须完成：J-05 的限流（**IP 维度已落地**，R-20261101-34；仍缺按门店配额）、
# WAF 或网关侧封禁规则、以及"被刷时如何降级"的处置流程。只改这一个开关不算开启。
pms.public-api.enabled=${PMS_PUBLIC_API_ENABLED:false}

# ---------- 住客实名加密（ADR-018 §2.4） ----------
# 身份证号必须加密存储，因此这两个密钥是**启动硬前提**：缺任何一个，GuestPiiCipher 构造即失败。
# 这是有意的：宁可服务起不来，也不要出现"没配就跑起来、悄悄存明文"的降级路径。
#
# 生成（不要复用、不要提交到仓库）：
#   export PMS_GUEST_PII_KEY="$(openssl rand -base64 32)"
#   export PMS_GUEST_PII_HMAC_KEY="$(openssl rand -base64 32)"
#
# 两个密钥必须独立：
#   · AES 密钥泄漏 → 全部密文可直接解；
#   · HMAC 密钥泄漏 → 只能对已知号码算摘要（反查某人是否在某账户）。
#   混用一个密钥会让后者升级成前者。
pms.guest.pii-key=${PMS_GUEST_PII_KEY:}
pms.guest.pii-hmac-key=${PMS_GUEST_PII_HMAC_KEY:}

# ---------- 住客归属验证的开发信箱（ADR-019 §2.10） ----------
# 短信/邮件服务商未接通前的挑战投递替代：把验证码放进进程内信箱，
# 供本地联调与集成测试取用。生产**绝不能**打开——打开后任何登录用户
# 都能通过响应外的信箱读取方式拿到任意目标的验证码。
# 接通真实服务商后：实现 OwnershipChallengeSender + 关闭此开关。
pms.guest.ownership.dev-mailbox=${PMS_GUEST_OWNERSHIP_DEV_MAILBOX:false}
