# 集成测试档案：需要真实 PostgreSQL（本地用 scripts/dev-db.sh 起一次性集群）。
# 默认指向 127.0.0.1:55432/pms，可用 PMS_DB_* 覆盖。
#
# 为什么要独立档案而不是复用 local：
#   集成测试要断言"应用账号不能建表""跨租户外键失败"这类数据库行为，
#   必须与 local 一样使用非超级用户账号，并且文档开关与日志级别要收敛，避免噪声。
spring.datasource.url=jdbc:postgresql://${PMS_DB_HOST:127.0.0.1}:${PMS_DB_PORT:55432}/${PMS_DB_NAME:pms}
spring.datasource.username=${PMS_DB_USER:pms_app}
spring.datasource.password=${PMS_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.pool-name=pms-it

spring.flyway.enabled=true
spring.flyway.user=${PMS_DB_MIGRATOR_USER:pms_migrator}
spring.flyway.password=${PMS_DB_MIGRATOR_PASSWORD:}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.root=WARN
logging.level.cn.sec.hn.openbackupsaas=INFO

# 集成测试关闭调度：用例自己调用服务方法触发扫描，后台线程会破坏"这批到底释放了几单"的断言。
pms.reservation.expiry.enabled=false

# 集成测试关闭 Outbox 后台任务：用例自己驱动发布器，才能断言"这批到底发了几条"。
pms.outbox.poller.enabled=false
pms.outbox.monitor.enabled=false

# 集成测试关闭 Inbox 监听：用例自己驱动 InboxProcessor，避免后台容器抢消息。
pms.inbox.enabled=false

# 集成测试关闭外部任务 Worker：后台线程会与断言抢时序。
pms.integration.task.worker-enabled=false

# 集成测试关闭定时对账：用例自己驱动 ReconcileService，才能断言"这一轮到底发现了什么"。
pms.reconcile.enabled=false
