# 单元/上下文测试档案：不依赖真实数据库。
# 说明：这些排除项只用于"能起上下文"的冒烟测试，**不代表**数据库行为已被验证。
# 库存占用、排斥约束、幂等、并发等正确性必须用真实 PostgreSQL 验证（S1-05、S1-13）。
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration,\
  org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration

spring.flyway.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.root=WARN
logging.level.cn.sec.hn.openbackupsaas=INFO

# 调度在测试里必须关闭：无库上下文跑不起来扫描，且后台线程会与清库/断言抢时序。
pms.reservation.expiry.enabled=false

# Outbox 后台任务在测试中必须关闭：无库环境跑不动，有库时后台线程会与断言抢时序。
pms.outbox.poller.enabled=false
pms.outbox.monitor.enabled=false

# Inbox 消费者在测试中关闭：由用例直接调用处理器，才能断言应用次数与去重结果。
pms.inbox.enabled=false

# 外部任务 Worker 在测试中关闭：用例直接调用执行器，才能断言"这一轮到底做了什么"。
pms.integration.task.worker-enabled=false
