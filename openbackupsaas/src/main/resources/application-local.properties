# 本地开发档案。数据源全部取自环境变量；密码默认为空 —— 连不上就失败，不用假凭据掩盖环境缺失。
# 本地一次性集群（scripts/dev-db.sh）使用 trust 认证，因此空密码可连；任何共享环境必须配口令。
spring.datasource.url=jdbc:postgresql://${PMS_DB_HOST:127.0.0.1}:${PMS_DB_PORT:55432}/${PMS_DB_NAME:pms}
spring.datasource.username=${PMS_DB_USER:pms_app}
spring.datasource.password=${PMS_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${PMS_DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.pool-name=pms-local

# 迁移账号与应用账号分权：应用账号只有 DML，DDL 由 pms_migrator 执行。
spring.flyway.enabled=true
spring.flyway.user=${PMS_DB_MIGRATOR_USER:pms_migrator}
spring.flyway.password=${PMS_DB_MIGRATOR_PASSWORD:}

# 本地开发放开 OpenAPI/Swagger；生产必须 PMS_OPENAPI_ENABLED=false。
springdoc.api-docs.enabled=${PMS_OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${PMS_OPENAPI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.cn.sec.hn.openbackupsaas=DEBUG
logging.level.org.springframework.jdbc.core=INFO
