# 本地开发档案。数据源全部取自环境变量；密码默认为空 —— 连不上就失败，不用假凭据掩盖环境缺失。
# 本地一次性集群（scripts/dev-db.sh）使用 trust 认证，因此空密码可连；任何共享环境必须配口令。
spring.datasource.url=jdbc:postgresql://${PMS_DB_HOST:127.0.0.1}:${PMS_DB_PORT:55432}/${PMS_DB_NAME:pms}
spring.datasource.username=${PMS_DB_USER:pms_app}
spring.datasource.password=${PMS_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${PMS_DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.pool-name=pms-local

# 迁移账号与应用账号分权：应用账号只有 DML，DDL 由 pms_migrator 执行。
spring.flyway.enabled=true
spring.flyway.user=${PMS_DB_MIGRATOR_USER:pms_migrator}
spring.flyway.password=${PMS_DB_MIGRATOR_PASSWORD:}

# 本地开发放开 OpenAPI/Swagger；生产必须 PMS_OPENAPI_ENABLED=false。
springdoc.api-docs.enabled=${PMS_OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${PMS_OPENAPI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.cn.sec.hn.openbackupsaas=DEBUG
logging.level.org.springframework.jdbc.core=INFO

# 限流（J-05）：本地开着，好让"限额挡到自己"这件事早点暴露，而不是等生产才发现。
# 但联调与端到端验证会在几分钟内反复登录几十次（换账号、重跑脚本），
# 所以把登录档位放大；生产档位见 application.properties，不要在那边照着改。
pms.rate-limit.enabled=${PMS_RATE_LIMIT_ENABLED:true}
pms.rate-limit.rules.staff.login.permits=${PMS_LOCAL_STAFF_LOGIN_PERMITS:200}
pms.rate-limit.rules.staff.login.window=PT5M
pms.rate-limit.rules.guest.login.permits=${PMS_LOCAL_GUEST_LOGIN_PERMITS:100}
pms.rate-limit.rules.guest.login.window=PT5M
pms.rate-limit.rules.guest.register.permits=100
pms.rate-limit.rules.guest.binding.challenge.permits=100
pms.rate-limit.rules.guest.binding.confirm.permits=100
pms.rate-limit.rules.public.catalog.permits=600

# ---------- 匿名公开面（R-20261103-02 起本地默认开） ----------
# 开启依据：J-05 应用层限流 + 按门店配额（public.catalog.hotel）+ 开启 checklist
# （docs/operations/public-api-checklist.md）已就绪。生产**仍按 checklist 逐项确认后**
# 用 PMS_PUBLIC_API_ENABLED=true 开启——本地开是为了 C 端（guest 工程）联调与冒烟。
pms.public-api.enabled=${PMS_PUBLIC_API_ENABLED:true}
