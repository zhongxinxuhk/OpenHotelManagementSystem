name: frontend

# 前端门禁：tsc + biome lint + build（ADR-015 三件套）。
# 本地 Agent 沙箱无法完成 npm ci（见 docs/verification/S3-01a），CI 是当前唯一可重复的依赖安装环境。
on:
  push:
    paths:
      - 'frontend-admin-pro/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend-admin-pro/**'
      - '.github/workflows/frontend.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend-admin-pro
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-admin-pro/package-lock.json

      - name: Install (locked)
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run tsc

      - name: Lint
        run: npm run biome:lint

      - name: Build
        run: npm run build
