name: backend

# 后端门禁（S1-01）：干净检出必须能编译、跑单元测试，并在**真实 PostgreSQL** 上跑
# 组织 / 约束 / 占用排斥 / 幂等 / 订单生命周期 / 到期承接的集成测试。
#
# 三条不能省的约定：
#   1. 集成测试由 PMS_IT_DB=true 打开；这里显式设成 true，并且**断言没有任何用例被跳过**
#      （见 "Assert no skipped tests"）——只看 BUILD SUCCESS 会被静默跳过骗过。
#   2. 数据库账号分权与 local 一致：应用账号 pms_app 只有 DML，迁移账号 pms_migrator 才能 DDL。
#      每次从空库跑完整迁移链，等于顺带验证了 V1→最新 的迁移历史可用。
#   3. 失败时把 surefire 报告留下来，成功时把可执行 jar 留下来（供手工核验）。
on:
  push:
    paths:
      - 'openbackupsaas/**'
      # 契约基线是后端门禁的输入：只改基线不改代码时，OpenApiContractTest 同样需要重跑，
      # 否则"悄悄放宽契约"可以绕过 CI。
      - 'docs/api/openapi-v1.json'
      - '.github/workflows/backend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'openbackupsaas/**'
      - 'docs/api/openapi-v1.json'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

# 最小权限：本 workflow 只读仓库。
permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  PMS_IT_DB: 'true'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        # 与 ADR-011 选定的大版本一致；锁大版本不锁补丁，补丁升级走依赖评审。
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PMS_DB_HOST: 127.0.0.1
      PMS_DB_PORT: '5432'
      PMS_DB_NAME: pms
      PMS_DB_USER: pms_app
      PMS_DB_PASSWORD: ci_app_only
      PMS_DB_MIGRATOR_USER: pms_migrator
      PMS_DB_MIGRATOR_PASSWORD: ci_migrator_only

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: openbackupsaas/pom.xml

      - name: Bootstrap database roles and grants
        env:
          PGPASSWORD: postgres
        # 容器内 host 连接为 scram 认证，因此给两个非超级用户角色设置一次性口令；
        # 该口令只存在于本次 job 的临时容器中，不用于任何共享环境。
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres \
               -v ON_ERROR_STOP=1 -v dbname=pms -f openbackupsaas/scripts/db-bootstrap.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
               -c "ALTER ROLE pms_app PASSWORD 'ci_app_only'" \
               -c "ALTER ROLE pms_migrator PASSWORD 'ci_migrator_only'"

      - name: Verify (compile + unit + postgres integration tests)
        working-directory: openbackupsaas
        # clean 不是为了"干净好看"：下面的断言统计 target/surefire-reports 下所有报告，
        # 残留的旧报告会让计数与本次运行对不上（本地复跑时实测出现 134 ≠ 132）。
        # CI 里 target 本来就不存在，这一步是给"本地也能复现同一结论"兜底。
        # -Dstyle.color=never：CI 日志不夹杂 ANSI 转义，检索错误更容易
        run: ./mvnw -B -ntp -Dstyle.color=never clean verify

      - name: Assert no skipped tests
        # 集成测试被跳过 = 门禁形同虚设。宁可显式失败，也不要一个"绿但没测数据库"的构建。
        working-directory: openbackupsaas
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          files = glob.glob('target/surefire-reports/TEST-*.xml')
          if not files:
              sys.exit('没有找到 surefire 报告：verify 可能没真正执行测试')

          total = skipped = failures = errors = 0
          for path in files:
              root = ET.parse(path).getroot()
              total += int(root.get('tests', 0))
              skipped += int(root.get('skipped', 0))
              failures += int(root.get('failures', 0))
              errors += int(root.get('errors', 0))

          print(f'tests={total} skipped={skipped} failures={failures} errors={errors}')
          if skipped:
              sys.exit(f'CI 中不允许跳过用例：{skipped} 个被跳过。'
                       'PMS_IT_DB 或 PostgreSQL service 可能未就绪。')
          if total == 0:
              sys.exit('测试总数为 0，视为门禁失效')
          PY

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: openbackupsaas/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload runnable jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          # *.jar.original 是 Spring Boot 重打包前的原始 jar，发布用不到
          path: |
            openbackupsaas/target/*.jar
            !openbackupsaas/target/*.jar.original
          if-no-files-found: warn
          retention-days: 7
